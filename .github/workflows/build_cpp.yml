name: C++ Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    container:
      image: ghcr.io/njm08/seeplusplus-opencv:latest
      options: --user root # TODO Workaround for now, since the git checkout does not work otherwise.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Configure with CMake
        run: cmake -S . -B ./build

      - name: Build
        run: cmake --build ./build --parallel